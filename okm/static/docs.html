<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noc152 · Docs API</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --panel: #141414;
      --line: #2a2a2a;
      --text: #ededed;
      --muted: #8b8b8b;
      --accent: #f54e00;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
    .bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem;
      padding: 0.75rem 1rem; border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #121212, var(--bg));
      flex: 0 0 auto;
    }
    .bar h1 {
      margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.03em;
    }
    .bar h1 em { font-style: normal; color: var(--accent); }
    .bar .tag {
      font-size: 0.68rem; color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.45rem;
    }
    .bar select, .bar a {
      font: inherit; font-size: 0.82rem; color: var(--text);
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 0.35rem 0.55rem; text-decoration: none;
    }
    .bar a.primary {
      background: rgba(245,78,0,0.16); border-color: var(--accent); color: #fff; font-weight: 600;
    }
    .bar .grow { flex: 1; }
    .note {
      margin: 0; padding: 0.55rem 1rem; font-size: 0.78rem; color: var(--muted);
      border-bottom: 1px solid var(--line); flex: 0 0 auto;
    }
    #app { flex: 1 1 auto; min-height: 0; }
  </style>
</head>
<body>
  <header class="bar">
    <h1>Noc<em>152</em></h1>
    <span class="tag">docs · Scalar</span>
    <label class="tag" for="specSelect">Spec</label>
    <select id="specSelect" aria-label="Spec OpenAPI"></select>
    <span class="grow"></span>
    <a href="/docs">Docs NOC</a>
    <a href="/" class="primary">← Mapa 3D</a>
  </header>
  <p class="note">
    Contrato técnico OpenAPI (Scalar). Secundario: el demo a menudo viene incompleto.
    Ficha de operador: <a id="nocDocsLink" href="/docs" style="color:#f54e00">Docs NOC</a>.
  </p>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const rootId = params.get("root") || "";
    const select = document.getElementById("specSelect");
    let apiRef = null;

    function withRoot(path) {
      if (!rootId) return path;
      const sep = path.includes("?") ? "&" : "?";
      if (/[?&]root=/.test(path)) return path;
      return `${path}${sep}root=${encodeURIComponent(rootId)}`;
    }

    const nocLink = document.getElementById("nocDocsLink");
    if (nocLink) nocLink.href = withRoot("/docs");

    function preferredSpec(list) {
      const q = params.get("spec");
      if (q && list.some((s) => s.id === q)) return q;
      // Product contract of this root first; brain (noc152) only as fallback
      const product = list.find((s) => s.id !== "noc152");
      if (product) return product.id;
      if (list.some((s) => s.id === "noc152")) return "noc152";
      return list[0]?.id || "noc152";
    }

    function mount(specId) {
      const url = withRoot(`/api/openapi/${encodeURIComponent(specId)}`);
      const host = document.getElementById("app");
      host.innerHTML = "";
      apiRef = Scalar.createApiReference("#app", {
        url,
        theme: "kepler",
        layout: "modern",
        darkMode: true,
        forceDarkModeState: "dark",
        hideDarkModeToggle: true,
        // Docs-first: lectura del contrato; sin Try it out (NOC ≠ Postman)
        hideClientButton: true,
        hideTestRequestButton: true,
        hiddenClients: true,
        hideModels: false,
        defaultOpenAllTags: false,
      });
      const next = new URL(location.href);
      next.searchParams.set("spec", specId);
      if (rootId) next.searchParams.set("root", rootId);
      history.replaceState(null, "", next);
    }

    (async () => {
      const res = await fetch(withRoot("/api/openapi"));
      const data = await res.json();
      const specs = data.specs || [];
      select.innerHTML = specs.map(
        (s) => `<option value="${s.id}">${s.title || s.id}</option>`
      ).join("");
      const id = preferredSpec(specs);
      select.value = id;
      mount(id);
      select.addEventListener("change", () => mount(select.value));
    })().catch((err) => {
      document.getElementById("app").innerHTML =
        `<p class="note">No pude cargar specs: ${err.message}</p>`;
    });
  </script>
</body>
</html>
