<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noc152 · Docs API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    :root {
      --bg: #0c0c0c;
      --panel: #141414;
      --line: #2a2a2a;
      --text: #ededed;
      --muted: #8b8b8b;
      --accent: #f54e00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, sans-serif;
    }
    .bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem;
      padding: 0.75rem 1rem; border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #121212, var(--bg));
      position: sticky; top: 0; z-index: 20;
    }
    .bar h1 {
      margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.03em;
    }
    .bar h1 em { font-style: normal; color: var(--accent); }
    .bar .tag {
      font-size: 0.68rem; color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.45rem;
    }
    .bar select, .bar a {
      font: inherit; font-size: 0.82rem; color: var(--text);
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 0.35rem 0.55rem; text-decoration: none;
    }
    .bar a.primary {
      background: rgba(245,78,0,0.16); border-color: var(--accent); color: #fff; font-weight: 600;
    }
    .bar .grow { flex: 1; }
    .note {
      margin: 0; padding: 0.55rem 1rem; font-size: 0.78rem; color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    /* Swagger on dark chrome */
    .swagger-ui { background: var(--bg); }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info .title { color: var(--text); }
    .swagger-ui .info p, .swagger-ui .info li, .swagger-ui .markdown p { color: #c8c8c8; }
    .swagger-ui .scheme-container { background: var(--panel); box-shadow: none; }
    .swagger-ui .opblock-tag { color: var(--text); border-color: var(--line); }
    .swagger-ui section.models { border-color: var(--line); }
  </style>
</head>
<body>
  <header class="bar">
    <h1>Noc<em>152</em></h1>
    <span class="tag">docs · OpenAPI</span>
    <label class="tag" for="specSelect">Spec</label>
    <select id="specSelect" aria-label="Spec OpenAPI"></select>
    <span class="grow"></span>
    <a href="/" class="primary">← Mapa 3D</a>
  </header>
  <p class="note">
    Vista consultable del contrato HTTP (estilo Swagger). El grafo 3D sigue siendo la cara principal del NOC.
  </p>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script>
    const params = new URLSearchParams(location.search);
    const select = document.getElementById("specSelect");

    function preferredSpec(list) {
      const q = params.get("spec");
      if (q && list.some((s) => s.id === q)) return q;
      if (list.some((s) => s.id === "noc152")) return "noc152";
      return list[0]?.id || "noc152";
    }

    function mount(specId) {
      const url = `/api/openapi/${encodeURIComponent(specId)}`;
      SwaggerUIBundle({
        url,
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
        tryItOutEnabled: true,
        defaultModelsExpandDepth: 1,
      });
      const next = new URL(location.href);
      next.searchParams.set("spec", specId);
      history.replaceState(null, "", next);
    }

    (async () => {
      const res = await fetch("/api/openapi");
      const data = await res.json();
      const specs = data.specs || [];
      select.innerHTML = specs.map(
        (s) => `<option value="${s.id}">${s.title || s.id}</option>`
      ).join("");
      const id = preferredSpec(specs);
      select.value = id;
      mount(id);
      select.addEventListener("change", () => mount(select.value));
    })().catch((err) => {
      document.getElementById("swagger-ui").innerHTML =
        `<p class="note">No pude cargar specs: ${err.message}</p>`;
    });
  </script>
</body>
</html>
