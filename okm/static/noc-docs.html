<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noc152 · Docs NOC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0c0c;
      --panel: #141414;
      --panel-2: #1a1a1a;
      --line: #2a2a2a;
      --text: #ededed;
      --muted: #8b8b8b;
      --accent: #f54e00;
      --accent-dim: rgba(245, 78, 0, 0.14);
      --violet: #8b5cf6;
      --violet-dim: rgba(139, 92, 246, 0.14);
      --font: "Outfit", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg); color: var(--text); font-family: var(--font);
    }
    body {
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(245,78,0,0.08), transparent 55%),
        radial-gradient(700px 380px at 90% 0%, rgba(139,92,246,0.07), transparent 50%),
        var(--bg);
    }
    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.55rem;
      padding: 0.8rem 1.1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(12,12,12,0.92);
      backdrop-filter: blur(10px);
    }
    .bar h1 {
      margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.04em;
    }
    .bar h1 em { font-style: normal; color: var(--accent); }
    .tag {
      font-family: var(--mono); font-size: 0.66rem; color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 0.16rem 0.45rem;
    }
    .tag.accent {
      color: #ffd0bf; border-color: rgba(245,78,0,0.4); background: var(--accent-dim);
    }
    .grow { flex: 1; }
    a.btn {
      font: inherit; font-size: 0.8rem; color: var(--text); text-decoration: none;
      border: 1px solid var(--line); border-radius: 8px; padding: 0.35rem 0.65rem;
      background: var(--panel-2);
    }
    a.btn.primary {
      color: #fff; border-color: var(--accent); background: var(--accent-dim); font-weight: 600;
    }
    a.btn.ghost {
      color: #c4b5fd; border-color: rgba(139,92,246,0.35); background: var(--violet-dim);
    }
    main {
      max-width: 920px; margin: 0 auto; padding: 1.4rem 1.1rem 3rem;
    }
    .hero {
      margin-bottom: 1.5rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--line);
    }
    .hero .eyebrow {
      font-family: var(--mono); font-size: 0.7rem; color: var(--accent);
      letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 0.4rem;
    }
    .hero h2 {
      margin: 0 0 0.55rem; font-size: clamp(1.5rem, 3vw, 2rem);
      letter-spacing: -0.04em; font-weight: 700;
    }
    .hero p { margin: 0; color: #c8c8c8; line-height: 1.5; font-size: 0.98rem; }
    .flow {
      margin-top: 0.85rem; font-family: var(--mono); font-size: 0.78rem;
      color: #ddd6fe; padding: 0.55rem 0.7rem; border-radius: 10px;
      border: 1px solid rgba(139,92,246,0.3); background: var(--violet-dim);
    }
    section { margin: 1.6rem 0; }
    section h3 {
      margin: 0 0 0.65rem; font-size: 0.95rem; letter-spacing: -0.02em;
      display: flex; align-items: baseline; gap: 0.45rem;
    }
    section h3 span {
      font-family: var(--mono); font-size: 0.65rem; color: var(--muted); font-weight: 500;
    }
    .card {
      border: 1px solid var(--line); border-radius: 12px;
      background: rgba(20,20,20,0.9); padding: 0.85rem 0.95rem; margin-bottom: 0.55rem;
    }
    .card header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.35rem;
    }
    .card h4 { margin: 0; font-size: 1rem; letter-spacing: -0.02em; }
    .pill {
      font-family: var(--mono); font-size: 0.62rem; border-radius: 999px;
      padding: 0.12rem 0.4rem; border: 1px solid var(--line); color: var(--muted);
    }
    .pill.alta { color: #fecaca; border-color: rgba(239,68,68,0.45); background: rgba(239,68,68,0.1); }
    .pill.media { color: #fde68a; border-color: rgba(251,191,36,0.35); background: rgba(251,191,36,0.08); }
    .pill.baja { color: #a7f3d0; border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.08); }
    .card p { margin: 0.25rem 0; color: #d4d4d4; font-size: 0.9rem; line-height: 1.45; }
    .meta {
      font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
      display: grid; gap: 0.2rem; margin-top: 0.45rem;
    }
    .read-grid {
      display: grid; gap: 0.5rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .read-grid .card p { font-size: 0.84rem; color: var(--muted); }
    .break .card header h4 { font-size: 0.92rem; }
    .empty { color: var(--muted); font-size: 0.9rem; }
    .files {
      display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem;
    }
    a.file {
      font-family: var(--mono); font-size: 0.68rem; color: #ddd6fe;
      text-decoration: none; border: 1px solid rgba(139,92,246,0.35);
      background: var(--violet-dim); border-radius: 999px; padding: 0.18rem 0.5rem;
    }
    a.file:hover { border-color: var(--accent); color: #ffd0bf; background: var(--accent-dim); }
    .files.overview a.file { border-radius: 8px; padding: 0.28rem 0.55rem; }
    footer {
      margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line);
      font-family: var(--mono); font-size: 0.68rem; color: var(--muted); line-height: 1.45;
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1>Noc<em>152</em></h1>
    <span class="tag accent">docs NOC</span>
    <span class="tag" id="audTag">operador</span>
    <span class="grow"></span>
    <a class="btn ghost" id="apiLink" href="/docs/api" title="Contrato OpenAPI (técnico, a menudo incompleto)">Contrato API</a>
    <a class="btn" id="mdLink" href="/api/docs/noc.md" target="_blank" rel="noopener">Markdown</a>
    <a class="btn primary" id="mapLink" href="/">← Mapa 3D</a>
  </header>
  <main id="main">
    <p class="empty">Cargando ficha NOC…</p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const rootId = params.get("root") || "";

    function withRoot(path) {
      if (!rootId) return path;
      const sep = path.includes("?") ? "&" : "?";
      if (/[?&]root=/.test(path)) return path;
      return `${path}${sep}root=${encodeURIComponent(rootId)}`;
    }

    const esc = (s) => String(s ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;");

    function pill(crit) {
      const c = String(crit || "media");
      return `<span class="pill ${esc(c)}">${esc(c)}</span>`;
    }

    function fileLinks(files, cls) {
      const list = Array.isArray(files) ? files : [];
      if (!list.length) return "";
      return `<div class="files ${cls || ""}">${list.map((f) => {
        const href = withRoot(f.url || `#`);
        const label = f.ref || f.path || "";
        const tip = f.piece ? `${label} · ${f.piece}` : label;
        return `<a class="file" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(tip)}">${esc(label)}</a>`;
      }).join("")}</div>`;
    }

    // Wire chrome links to the same root (avoid Martian bleed-through)
    document.getElementById("apiLink").href = withRoot("/docs/api");
    document.getElementById("mdLink").href = withRoot("/api/docs/noc.md");
    document.getElementById("mapLink").href = rootId ? `/?root=${encodeURIComponent(rootId)}` : "/";

    function render(hand) {
      document.title = `Noc152 · ${hand.title || "Docs NOC"}`;
      const aud = document.getElementById("audTag");
      if (aud) aud.textContent = hand.audience_label || "operador NOC";

      const pieces = (hand.pieces || []).map((p) => {
        const deps = (p.depends_on || []).length
          ? `Depende de: ${p.depends_on.map(esc).join(", ")}`
          : "Sin deps declaradas";
        const used = (p.used_by || []).length
          ? `Lo usan: ${p.used_by.map(esc).join(", ")}`
          : "";
        const svc = p.service ? `<span class="pill">${esc(p.service)}</span>` : "";
        return `<article class="card">
          <header>
            <h4>${esc(p.role)}</h4>
            ${pill(p.criticality)}
            ${svc}
          </header>
          <p>${esc(p.summary)}</p>
          <div class="meta">
            <div>${deps}</div>
            ${used ? `<div>${used}</div>` : ""}
          </div>
          ${fileLinks(p.key_files)}
        </article>`;
      }).join("");

      const breaks = (hand.if_something_breaks || []).map((b) => `
        <article class="card">
          <header>
            <h4>${esc(b.when)}</h4>
            ${pill(b.criticality)}
          </header>
          <p>${esc(b.impact)}</p>
          <div class="meta">Mirar: ${esc((b.check || []).join(" · "))}</div>
          ${fileLinks(b.key_files)}
        </article>
      `).join("");

      const ht = hand.how_to_read || {};
      const keySec = (hand.key_files || []).length
        ? `<section>
            <h3>Archivos clave <span>${hand.key_files.length}</span></h3>
            <p class="empty" style="margin:0 0 0.55rem">Código más citado en el expediente de esta raíz (abrí para ver el archivo).</p>
            ${fileLinks(hand.key_files, "overview")}
          </section>`
        : "";

      document.getElementById("main").innerHTML = `
        <div class="hero">
          <p class="eyebrow">Ficha operativa · generada desde Combinado${hand.root ? ` · ${esc(hand.root)}` : ""}</p>
          <h2>${esc(hand.title)}</h2>
          <p>${esc(hand.summary)}</p>
          ${hand.flow ? `<div class="flow">${esc(hand.flow)}</div>` : ""}
        </div>

        ${keySec}

        <section>
          <h3>Cómo leer el mapa <span>operación</span></h3>
          <div class="read-grid">
            <div class="card"><p>${esc(ht.map || "")}</p></div>
            <div class="card"><p>${esc(ht.edges || "")}</p></div>
            <div class="card"><p>${esc(ht.drill || "")}</p></div>
          </div>
        </section>

        <section>
          <h3>Catálogo de piezas <span>${(hand.pieces || []).length}</span></h3>
          ${pieces || '<p class="empty">Sin piezas en el mapa Combinado.</p>'}
        </section>

        <section class="break">
          <h3>Si algo falla <span>prioridad</span></h3>
          ${breaks}
        </section>

        <footer>
          Audiencia: ${esc(hand.audience_label)}. Esto no es Swagger: es la ficha que un NOC usa para entender el sistema.<br/>
          Contrato HTTP (OpenAPI/Scalar) es opcional y a menudo viene vacío si el repo no lo documentó —
          <a href="${esc(withRoot(hand.links?.api_contract || "/docs/api"))}" style="color:var(--accent)">abrir contrato técnico</a>.
        </footer>
      `;
    }

    (async () => {
      try {
        const res = await fetch(withRoot("/api/docs/noc"));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        render(data);
      } catch (err) {
        document.getElementById("main").innerHTML =
          `<p class="empty">No pude generar la ficha NOC: ${esc(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
